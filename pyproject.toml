[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S608: SQL is built only from fixed fragments; all values go through %s parameters.
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"setup_db.py" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest", "scripts", "setup_db"]
