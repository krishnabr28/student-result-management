# Optional: run MySQL 8 in Docker instead of installing it.
#   docker compose up -d
# Then in .env use DB_HOST=127.0.0.1, DB_PORT=3307, DB_USER=root.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env first}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
